name: Build Nexos Live ISO

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo "Updating package list..."
          sudo apt-get update -qq || (echo "❌ apt update failed"; exit 1)
          echo "✓ Package list updated"
          
          echo ""
          echo "Installing live-build and dependencies..."
          sudo apt-get install -y --no-install-recommends \
            live-build debootstrap dpkg-dev xorriso syslinux-utils isolinux rsync genisoimage squashfs-tools 2>&1 | grep -E "(Setting up|already|done|Unpacking)" || true
          
          echo ""
          echo "Verifying installation..."
          lb --version || (echo "❌ lb not found after install"; exit 1)
          which live-build
          which debootstrap
          which xorriso || echo "⚠ xorriso not found"
          which mksquashfs || echo "⚠ squashfs-tools not found"
          echo "✓ All build tools installed successfully"

      - name: Verify required files
        working-directory: nexos-live
        run: |
          echo "Checking required files..."
          [ -f "index.html" ] && echo "✓ index.html" || (echo "✗ index.html missing" && exit 1)
          [ -f "nexos-launch.sh" ] && echo "✓ nexos-launch.sh" || (echo "✗ nexos-launch.sh missing" && exit 1)
          [ -d "config/hooks/normal" ] && echo "✓ config/hooks/normal" || (echo "✗ config/hooks/normal missing" && exit 1)

      - name: Prepare build environment
        working-directory: nexos-live
        run: |
          mkdir -p config/includes.chroot/usr/share/nexos-ui
          mkdir -p config/includes.chroot/usr/local/bin
          chmod +x nexos-launch.sh
          echo "✓ Build directories prepared"

      - name: Copy UI files
        working-directory: nexos-live
        run: |
          cp -f index.html config/includes.chroot/usr/share/nexos-ui/
          cp -f nexos-launch.sh config/includes.chroot/usr/local/bin/
          chmod +x config/includes.chroot/usr/local/bin/nexos-launch.sh
          echo "✓ UI files copied"

      - name: Verify hook scripts
        working-directory: nexos-live
        run: |
          echo "Checking hook scripts..."
          find config/hooks/normal -type f -name '*.hook.chroot' -exec chmod +x {} \;
          ls -lh config/hooks/normal/
          echo "✓ Hooks are executable"

      - name: Clean previous builds
        working-directory: nexos-live
        run: |
          echo "Cleaning previous build artifacts..."
          rm -rf cache/ chroot/ build/ *.iso *.log *.sha256 2>/dev/null || true
          echo "Removing live-build configuration..."
          sudo lb clean --all 2>&1 || echo "⚠ lb clean failed or lb not available (may be OK on first run)"
          echo ""
          echo "Disk space available:"
          df -h | head -3
          echo "✓ Workspace cleaned"

      - name: Configure live-build
        working-directory: nexos-live
        run: |
          echo "Configuring live-build..."
          echo "Checking lb version:"
          lb --version
          echo ""
          echo "Running lb config with comprehensive output..."
          set -x
          sudo lb config \
            --mode ubuntu \
            --distribution jammy \
            --architecture amd64 \
            --archive-areas "main universe" \
            --binary-images iso-hybrid \
            --apt-recommends false \
            --apt-indices false \
            --debootstrap-options "--variant=minbase" \
            --debian-installer false \
            --memtest none \
            --bootappend-live "boot=live components splash" \
            2>&1 | tee lb-config.log
          LB_CONFIG_EXIT=${PIPESTATUS[0]}
          set +x
          if [ $LB_CONFIG_EXIT -ne 0 ]; then
            echo "✗ lb config failed with exit code $LB_CONFIG_EXIT"
            echo "=== Last 80 lines of lb config output ==="
            tail -80 lb-config.log || cat lb-config.log || true
            exit $LB_CONFIG_EXIT
          fi
          echo "✓ live-build configured successfully"
          echo "Config files created:"
          ls -la config/ | head -12

      - name: Verify configuration
        working-directory: nexos-live
        run: |
          echo "Verifying live-build configuration..."
          ls -la config/ | head -20
          [ -f "config/bootstrap" ] && echo "✓ config/bootstrap exists" || echo "⚠ config/bootstrap not found"

      - name: Build ISO
        working-directory: nexos-live
        run: |
          echo "Starting ISO build (this may take 30-60 minutes)..."
          df -h | head -3
          echo "---"
          
          # Run the build with comprehensive error handling
          echo "Running: sudo lb build"
          if sudo lb build 2>&1 | tee build.log; then
            echo "✓ lb build completed"
            BUILD_EXIT=0
          else
            BUILD_EXIT=$?
          fi
          
          echo "Build exit code: $BUILD_EXIT"
          
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "✗ lb build failed with exit code $BUILD_EXIT"
            echo "=== Last 150 lines of build log ==="
            tail -150 build.log || true
            exit $BUILD_EXIT
          fi
          
          echo "✓ lb build succeeded, checking for ISO..."

      - name: Verify ISO was created
        working-directory: nexos-live
        run: |
          echo "Checking for ISO output..."
          if [ -f "live-image-amd64.hybrid.iso" ]; then
            SIZE=$(du -h live-image-amd64.hybrid.iso | cut -f1)
            echo "✓ ISO created: $SIZE"
            ls -lh live-image-amd64.hybrid.iso
          else
            echo "✗ ISO not found at expected location"
            echo "=== Searching for any .iso files ==="
            find . -maxdepth 3 -name '*.iso' -type f 2>/dev/null || echo "No .iso files found"
            echo "=== Last 50 lines of build log ==="
            tail -50 build.log || true
            exit 1
          fi

      - name: Generate checksum
        if: success()
        working-directory: nexos-live
        run: |
          echo "Generating checksums..."
          sha256sum live-image-amd64.hybrid.iso > live-image-amd64.hybrid.iso.sha256
          echo "✓ Checksum generated"
          cat live-image-amd64.hybrid.iso.sha256

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nexos-iso
          path: |
            nexos-live/live-image-amd64.hybrid.iso
            nexos-live/live-image-amd64.hybrid.iso.sha256
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}
          path: nexos-live/build.log
          retention-days: 5

      - name: Cleanup workspace
        if: always()
        working-directory: nexos-live
        run: |
          echo "Cleaning up workspace..."
          rm -rf cache/ chroot/ build/ 2>/dev/null || true
          du -h . --max-depth=1 | sort -h
